name: C/C++ CI and CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
      pull-requests: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v7
      - uses: lukka/get-cmake@latest
        if: runner.os == 'Linux'

      - name: Initialize CodeQL
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'gcc'
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libboost-dev libcrypto++-dev libglib2.0-dev libreadline-dev libwxgtk3.2-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install gettext boost cryptopp glib readline wxwidgets

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DBUILD_DAEMON=ON
          -DBUILD_REMOTEGUI=ON
          -DBUILD_AMULECMD=ON
          -DBUILD_AMULEAPI=ON
          -DBUILD_TESTING=ON
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }}

      - name: Test daemon startup
        run: ${{ steps.strings.outputs.build-output-dir }}/src/amuled --version

      - name: Test
        run: ctest --test-dir ${{ steps.strings.outputs.build-output-dir }} --output-on-failure

      - name: Perform CodeQL Analysis
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'gcc'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
